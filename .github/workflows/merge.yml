name: Merge Game Data
on: workflow_dispatch
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge parts
        run: cat raw_game_data/*.part* > AliceInCradle_Data.tar.gz
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-data
          path: AliceInCradle_Data.tar.gz
